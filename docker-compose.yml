version: '3.8'

services:
  app:
    image: node:20-alpine
    container_name: my-pinterest-app
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    # Команда для запуска режима разработки (измени под свой package.json, если нужно, например: npm start)
    command: npm run dev
    environment:
      - NODE_ENV=development
      - OLLAMA_HOST=http://host.docker.internal:11434
    # Гарантирует, что контейнер сможет достучаться до Ollama на хосте (Windows)
    extra_hosts:
      - "host.docker.internal:host-gateway"
