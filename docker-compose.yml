services:
  neural_core:
    # Используем открытое зеркало для скачивания Ollama
    image: dockerhub.timeweb.cloud/ollama/ollama:latest
    container_name: schiele_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_memory:/root/.ollama
    restart: unless-stopped

  overseer_node:
    # Используем открытое зеркало для скачивания Node.js
    image: dockerhub.timeweb.cloud/library/node:20-alpine
    container_name: schiele_overseer
    working_dir: /usr/src/app
    volumes:
      - ./:/usr/src/app
    ports:
      - "4000:4000"
    command: npm run dev
    depends_on:
      - neural_core
    environment:
      - OLLAMA_URL=http://neural_core:11434
      - NODE_ENV=development

volumes:
  ollama_memory:
